<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#1746CE" />
  <title>404 – Page Not Found | JSR EV Spare Parts</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800;14..32,900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #101B3D;
      background: linear-gradient(135deg, #f0f4ff 0%, #e8f0fe 50%, #f4fff0 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { text-decoration: none; color: inherit; }

    /* ── Top bar ── */
    .topbar {
      background: #1746CE;
      color: #fff;
      text-align: center;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    /* ── Navbar ── */
    .navbar {
      background: #fff;
      border-bottom: 1px solid #e1e5ee;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    .logo { display: flex; flex-direction: column; gap: 2px; }
    .logo__name { font-size: 18px; font-weight: 900; color: #1746CE; letter-spacing: -0.01em; }
    .logo__tag  { font-size: 10px; font-weight: 700; color: #65D510; letter-spacing: 0.08em; }
    .nav-home {
      display: inline-flex; align-items: center; gap: 8px;
      background: #1746CE; color: #fff;
      padding: 10px 20px; border-radius: 8px;
      font-size: 14px; font-weight: 600;
      transition: background 0.2s;
    }
    .nav-home:hover { background: #1239b0; }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      position: relative;
      overflow: hidden;
    }

    /* background sparks */
    .spark {
      position: absolute;
      border-radius: 50%;
      animation: float 7s ease-in-out infinite;
    }
    .spark-1 { width:180px; height:180px; background:#65D510; opacity:.15; top:4%;  left:-50px;  animation-delay:0s;    animation-duration:7s; }
    .spark-2 { width:120px; height:120px; background:#1746CE; opacity:.12; top:60%; right:-30px; animation-delay:1.5s;  animation-duration:5s; }
    .spark-3 { width: 80px; height: 80px; background:#65D510; opacity:.14; bottom:8%; left:22%;  animation-delay:3s;    animation-duration:8s; }
    .spark-4 { width:220px; height:220px; background:#1746CE; opacity:.08; top:30%; right:10%;  animation-delay:0.8s;  animation-duration:9s; }
    @keyframes float {
      0%,100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-22px) scale(1.05); }
    }

    /* card */
    .card {
      position: relative; z-index: 1;
      background: #fff;
      border-radius: 24px;
      padding: 56px 48px 48px;
      max-width: 520px; width: 100%;
      text-align: center;
      box-shadow: 0 2px 4px rgba(23,70,206,.06), 0 12px 40px rgba(23,70,206,.14);
      border: 1px solid rgba(23,70,206,.12);
    }

    /* bolt icon */
    .icon { width:80px; height:80px; margin: 0 auto 20px; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse {
      0%,100% { transform:scale(1);    filter:drop-shadow(0 0 0 #65D510); }
      50%      { transform:scale(1.08); filter:drop-shadow(0 0 10px #65D510); }
    }

    .code {
      font-size: clamp(72px, 16vw, 120px);
      font-weight: 900; line-height: 1;
      letter-spacing: -0.04em; margin-bottom: 8px;
      background: linear-gradient(135deg, #1746CE 30%, #65D510 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    h1 { font-size: clamp(22px,4vw,30px); font-weight:800; color:#101B3D; margin-bottom:14px; letter-spacing:-0.02em; }
    .sub { font-size:15px; line-height:1.65; color:#3d4a6b; margin-bottom:36px; }

    /* buttons */
    .actions { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-bottom:36px; }
    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      min-height:48px; padding:12px 24px; border-radius:10px;
      font-size:15px; font-weight:600; transition: background .2s, transform .15s;
    }
    .btn svg { width:18px; height:18px; flex-shrink:0; }
    .btn:hover { transform:translateY(-2px); }
    .btn-primary { background:#1746CE; color:#fff; border:2px solid #1746CE; }
    .btn-primary:hover { background:#1239b0; border-color:#1239b0; }
    .btn-secondary { background:transparent; color:#1746CE; border:2px solid #1746CE; }
    .btn-secondary:hover { background:#eef3fb; }

    /* brand */
    .brand {
      display:flex; align-items:center; gap:10px; justify-content:center;
      padding-top:24px; border-top:1px solid #e1e5ee;
    }
    .brand-name { font-size:15px; font-weight:800; color:#1746CE; letter-spacing:.04em; }
    .brand-sep  { width:32px; height:2px; background:#65D510; border-radius:2px; }
    .brand-tag  { font-size:11px; font-weight:700; color:#3d4a6b; letter-spacing:.08em; text-transform:uppercase; }

    @media (max-width:540px) {
      .card { padding:40px 24px 36px; border-radius:18px; }
      .actions { flex-direction:column; }
      .btn { width:100%; }
      .navbar { padding:0 16px; }
    }
  </style>
</head>
<body>

  <div class="topbar">E-Rickshaw Spare Parts &nbsp;|&nbsp; Rohini, Delhi</div>

  <nav class="navbar">
    <a href="/" class="logo" aria-label="JSR EV SPARE PARTS – home">
      <span class="logo__name">JSR EV</span>
      <span class="logo__tag">SPARE PARTS</span>
    </a>
    <a href="/" class="nav-home" aria-label="Go back to home">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12L12 3l9 9"/><path d="M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/>
      </svg>
      Home
    </a>
  </nav>

  <main>
    <span class="spark spark-1" aria-hidden="true"></span>
    <span class="spark spark-2" aria-hidden="true"></span>
    <span class="spark spark-3" aria-hidden="true"></span>
    <span class="spark spark-4" aria-hidden="true"></span>

    <div class="card">
      <!-- EV bolt icon -->
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="30" stroke="#1746CE" stroke-width="3"/>
          <path d="M36 10L18 36h14l-4 18L50 28H36L40 10z" fill="#65D510" stroke="#1746CE" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </div>

      <p class="code" aria-hidden="true">404</p>
      <h1>Page Not Found</h1>
      <p class="sub">
        Looks like this part isn't in our stock! The page you're looking for
        doesn't exist or has been moved.
      </p>

      <div class="actions">
        <a href="/" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12L12 3l9 9"/><path d="M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/>
          </svg>
          Back to Home
        </a>
        <a href="/#contact" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.8 19.79 19.79 0 01.03 1.18 2 2 0 012 .01h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92z"/>
          </svg>
          Contact Us
        </a>
      </div>

      <div class="brand">
        <span class="brand-name">JSR EV</span>
        <span class="brand-sep" aria-hidden="true"></span>
        <span class="brand-tag">Spare Parts</span>
      </div>
    </div>
  </main>

</body>
</html>
